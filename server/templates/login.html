<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2 Operator Login</title>
    <meta name="description" content="C2 operator authentication">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
    <main class="auth-box login-box">
        <span class="auth-icon">⬡</span>
        <h1 class="auth-title">C2 Project</h1>
        <p class="auth-sub">Enter the operator API key to open the dashboard</p>
        <form method="post" action="/login">
            <label class="sr-only" for="operator-api-key">Operator API key</label>
            <input type="password" class="auth-input" id="operator-api-key" name="api_key"
                placeholder="API key" autocomplete="current-password" required autofocus>
            <button class="auth-btn" type="submit">AUTHENTICATE</button>
        </form>
        {% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}
    </main>
</body>
</html>
